<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Video Download</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scrolling-text">
      Welcome to the Ultimate YouTube Video Downloader! 🔥 - Designed By:
      Sarthak Singh - visit here : sarthak03dot
    </div>

    <div class="container">
      <h2>YouTube Video Download (Video Link)</h2>
      <input
        id="youtubeUrl"
        type="text"
        placeholder="Paste YouTube link here (only video link)"
      />
      <select id="qualitySelect">
        <option value="360p">360p (Recommended)</option>
        <option value="720p">720p</option>
        <option value="1080p">1080p</option>
        <option value="best">Best Quality (Max)</option>
      </select>
      <button id="downloadBtn">Download</button>

      <!-- Spinner -->
      <div id="spinner" class="spinner" style="display: none"></div>

      <p id="status"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
